name: CacheSweep APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - "cachesweep-apk/**"
      - ".github/workflows/cachesweep-apk-build.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: cachesweep-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CacheSweep-APK
          path: cachesweep-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
